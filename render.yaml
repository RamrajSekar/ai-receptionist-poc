services:
  - type: web
    name: ai-receptionist-poc
    env: python
    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PIP_NO_CACHE_DIR
        value: "false"
      - key: NODE_VERSION
        value: 18
    plan: free
