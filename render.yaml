services:
  - type: web
    name: ai-receptionist-poc
    env: python
    buildCommand: bash ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14
      - key: PIP_NO_CACHE_DIR
        value: "false"
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_BASE_URL
        value: https://ai-receptionist-poc.onrender.com
    plan: free
